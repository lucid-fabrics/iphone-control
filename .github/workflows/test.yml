name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats-core
        run: brew install bats-core

      # Build the native input engine so the daemon tests run instead of
      # skipping. It needs no phone: those tests exercise argument validation
      # and daemon liveness, all of which fail-fast before touching Mirroring.
      - name: Build native input engine
        run: swiftc -O helpers/input-src/*.swift -o helpers/input

      - name: Run shell tests
        run: bats tests/

      - name: Install MCP server dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Run MCP server tests
        working-directory: mcp-server
        run: npm test

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Run shellcheck
        run: shellcheck -x *.sh
