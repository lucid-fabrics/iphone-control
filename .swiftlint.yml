# Project SwiftLint config.
# This codebase is coordinate math: x, y, x1, y1, dx, dy, mx (margin-x) etc.
# are the idiomatic names, so the generic short-identifier rule is relaxed.
identifier_name:
  min_length:
    warning: 1
    error: 1
line_length:
  warning: 300
  error: 320
cyclomatic_complexity:
  warning: 15
  error: 20
